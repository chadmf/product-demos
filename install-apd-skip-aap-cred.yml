---
- name: Install Ansible Product Demos (Skip AAP Credential)
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Make sure AAP credential environment variables are set
      ansible.builtin.assert:
        that:
          - lookup('env', 'AAP_HOSTNAME') != ''
          - >
            lookup('env', 'AAP_TOKEN') != '' or
            (lookup('env', 'AAP_USERNAME') != '' and lookup('env', 'AAP_PASSWORD') != '')

    - name: Include product-demos-postinstall variables (without AAP Credential)
      ansible.builtin.include_vars:
        file: common/bootstrap-vars-no-aap-credential.yml

    - name: Execute automation controller resource configuration
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
